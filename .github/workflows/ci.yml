name: ci
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MafDemo.slnx
      - name: Build
        run: dotnet build MafDemo.slnx --no-restore
      - name: Test (unit)
        # EvalSuite self-skips without RUN_EVALS=1 — unit tests stay hermetic.
        run: dotnet test MafDemo.slnx --no-build --logger 'console;verbosity=normal'

  evals:
    # Manual gate: the eval suite needs the live Ollama model
    # (glm-5.3-flash:cloud, bge-m3 embeddings), which cannot be pulled in a
    # standard GitHub runner — so evals run via `ollama serve` + `ollama pull`
    # only when it exists in the registry, or locally:
    #   RUN_EVALS=1 dotnet test tests/MafDemo.Core.Tests --filter EvalSuite
    # Documented in docs/projects/10-helpdesk-capstone/NOTES.md.
    needs: build-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RUN_EVALS: "1"
      OLLAMA_ENDPOINT: http://localhost:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve &
          sleep 5
      - name: Pull models
        run: |
          ollama pull glm-5.3-flash:cloud
          ollama pull bge-m3
      - name: Run eval suite
        run: |
          dotnet test tests/MafDemo.Core.Tests --filter EvalSuite \
            --logger 'console;verbosity=detailed'